events { worker_connections 1024; }
http {
  upstream api { server api:8000; }
  upstream frontend { server frontend:3000; }
  server {
    listen 80;
    location /api/ { proxy_pass http://api/; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
    location /docs { proxy_pass http://api/docs; }
    location /redoc { proxy_pass http://api/redoc; }
    location /openapi.json { proxy_pass http://api/openapi.json; }
    location / { proxy_pass http://frontend/; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; }
  }
}
